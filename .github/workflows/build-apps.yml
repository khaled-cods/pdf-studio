name: Build PDF Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack the newest uploaded project sources
        run: |
          f=$(git log --diff-filter=AM --name-only --format= -- '*.tar.gz' | grep -m1 .)
          echo "Using: $f"
          tar xzf "$f" && ls
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: python3 tools/build.py
      - uses: actions/upload-artifact@v4
        with: { name: www, path: www }

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack the newest uploaded project sources
        run: |
          f=$(git log --diff-filter=AM --name-only --format= -- '*.tar.gz' | grep -m1 .)
          echo "Using: $f"
          tar xzf "$f" && ls
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npx cap add android
      - name: App icons and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0B1F3D' --iconBackgroundColorDark '#0B1F3D' --splashBackgroundColor '#0B1520' --splashBackgroundColorDark '#0B1520'
      - name: Status bar color
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="colorPrimaryDark">@color/colorPrimaryDark</item>#<item name="colorPrimaryDark">\#0B1520</item><item name="android:statusBarColor">\#0B1520</item><item name="android:navigationBarColor">\#0B1520</item>#' $f
          cat $f
      - run: npx cap sync android
      - name: Same signing key on every build (so updates install over the old version)
        run: mkdir -p ~/.android && cp build/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk PDF-Studio.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: PDF-Studio.apk }

  linux:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack the newest uploaded project sources
        run: |
          f=$(git log --diff-filter=AM --name-only --format= -- '*.tar.gz' | grep -m1 .)
          echo "Using: $f"
          tar xzf "$f" && ls
      - uses: actions/download-artifact@v4
        with: { name: www, path: www }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    needs: [android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PDF Studio 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Android (الموبايل):** نزّل `PDF-Studio.apk` وافتحه.
            **Kali / Linux:** نزّل ملف `.deb` وسطّبه بـ `sudo apt install ./PDF-Studio-*.deb`، أو نزّل `.AppImage` وشغّله مباشرةً.
          files: |
            out/PDF-Studio.apk
            out/*.deb
            out/*.AppImage

